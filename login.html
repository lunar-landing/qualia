<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: #18181b;
            --border-color: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --accent-glow: rgba(56, 189, 248, 0.5);
            --accent-color: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, #1e1e24 0%, transparent 70%),
                linear-gradient(to bottom, #09090b, #000000);
            color: var(--text-primary);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 20px 40px -10px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* 顶部流光效果 */
        .login-card::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            opacity: 0.7;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #09090b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--text-primary);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            margin: 0 8px;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <h1>系统登录</h1>
            <p>请输入您的凭证以访问控制台</p>
        </div>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="email">账号</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="user@domain.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">进入系统</button>
        </form>

        <div class="footer-links">
            <a href="#">找回密码</a>
            <a href="#">申请权限</a>
        </div>
    </div>
</body>
</html>
