<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex · 工作空间</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" id="hljsTheme" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="js/browser.js"></script>
    <script src="js/tool-chip.js"></script>
    <script src="js/changes-panel.js"></script>
    <script src="js/terminal-panel.js"></script>
    <script src="js/file-viewer.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/project-panel.js"></script>
    <script src="js/token-map.js"></script>
    <link rel="stylesheet" href="index.css" />
    <style>
        /* 会话列表流式指示器 */
        .conversation-list li.streaming .streaming-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success, #3fb950);
            flex-shrink: 0;
            animation: streamPulse 1.2s ease-in-out infinite;
        }
        @keyframes streamPulse { 50% { opacity: 0.3; } }
        .conversation-list li.streaming { opacity: 1; }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== SIDEBAR（通顶：品牌 + 工作区 + 历史 + 设置） ===== -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-code"></i>
                <span>Qualia Code</span>
            </div>
            <!-- 工作区切换入口：名称/路径由 project-panel.js 回填，流式期间置灰 -->
            <button class="ws-switch-btn" id="wsSwitchBtn" title="切换工作区" onclick="openWorkspaceSwitcher()">
                <span class="ws-switch-icon"><i class="fas fa-folder-tree"></i></span>
                <span class="ws-switch-info">
                    <span class="ws-switch-name" id="wsSwitchName">工作区</span>
                    <span class="ws-switch-path" id="wsSwitchPath">加载中…</span>
                </span>
                <i class="fas fa-chevron-down ws-switch-arrow"></i>
            </button>
            <div class="sidebar-header">
                <h4><i class="far fa-clock history-icon"></i>历史</h4>
                <button title="新建会话" onclick="createSession()"><i class="fas fa-plus"></i></button>
            </div>
            <ul class="conversation-list">
                <!-- 会话列表由JS动态渲染 -->
            </ul>

            <!-- 近 30 日 token 用量热力矩阵（骨架与样式由 js/token-map.js 自包含注入） -->
            <div id="tokenHeatmap"></div>

            <div class="sidebar-footer">
                <button class="settings-btn" title="设置" onclick="openSettings()">
                    <i class="fas fa-sliders-h"></i>
                    <span>设置</span>
                </button>
            </div>
        </aside>

        <!-- ===== MAIN ===== -->
        <div class="main">

            <!-- ===== 内容层：聊天区 + 工作区面板水平排列 ===== -->
            <div class="main-content">

            <!-- ===== CHAT AREA ===== -->
            <section class="chat-area">

                <!-- 聊天区右上角悬浮操作舱：工作区面板开关 + 主题切换 -->
                <div class="chat-float-actions">
                    <button class="chat-float-btn" id="wsFloatBtn" title="工作区面板" onclick="toggleStepsPanel()"><i class="fas fa-layer-group"></i></button>
                    <span class="chat-float-sep"></span>
                    <button class="chat-float-btn" id="themeToggle" title="切换主题"><i class="fas fa-moon" id="themeIcon"></i></button>
                </div>

                <!-- ===== MESSAGES ===== -->
                <div class="messages" id="messageContainer">

                    <!-- 消息由JS动态渲染；空会话时显示欢迎Hero -->

                    <!-- Typing indicator（单智能体无登录态，不展示头像）-->
                    <div class="typing-indicator" id="typingIndicator">
                        <div class="typing-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>

                </div>

                <!-- ===== INPUT ===== -->
                <div class="input-area">
                    <div class="input-hold">
                        <div class="image-preview" id="imagePreview"></div>
                        <div class="input-wrapper">
                            <textarea id="chatInput" rows="1" placeholder="向 Qualia Code 提问，或描述你想写的代码…"></textarea>
                            <div class="input-tools">
                                <button class="tool-btn" title="发送附件：图片 / PDF / Word / 文本（支持粘贴截图）" id="attachBtn"><i class="fas fa-paperclip"></i></button>
                                <div class="model-selector" id="modelSelector">
                                    <span class="model-icon"></span>
                                    <span class="model-name" id="modelName">加载中...</span>
                                    <i class="fas fa-chevron-down model-arrow"></i>
                                    <div class="model-dropdown" id="modelDropdown">
                                        <!-- 动态生成 -->
                                    </div>
                                </div>
                                <button class="send-btn" id="sendBtn"><i class="fas fa-arrow-up"></i></button>
                            </div>
                            <input type="file" id="attachmentInput" accept="image/png,image/jpeg,image/gif,image/webp,.pdf,.docx,.txt,.md,.markdown,.csv,.json,.xml,.yml,.yaml,.log,.properties,.sql,.html,.js,.ts,.java,.py,.go,.c,.cpp,.h,.sh,.bat" multiple hidden>
                        </div>
                    </div>
                </div>

            </section>

            <!-- ===== 工作区面板：文件 + 终端 ===== -->
            <aside class="steps-panel" id="stepsPanel">
                <div class="ws-resizer" id="wsResizer"></div>
                <div class="steps-panel-header">
                    <h4><i class="fas fa-layer-group"></i> 工作区</h4>
                    <div class="steps-panel-actions">
                        <button title="放大" id="wsMaxBtn" onclick="toggleWsMaximize()"><i class="fas fa-up-right-and-down-left-from-center"></i></button>
                        <button title="关闭" onclick="toggleStepsPanel()"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <div class="ws-tabs">
                    <button class="ws-tab active" data-tab="wsFiles" onclick="switchWsTab('wsFiles', this)"><i class="fas fa-folder-open"></i> 文件</button>
                    <button class="ws-tab" data-tab="wsChanges" onclick="switchWsTab('wsChanges', this)"><i class="fas fa-code-pull-request"></i> 审查</button>
                    <button class="ws-tab" data-tab="wsTerm" onclick="switchWsTab('wsTerm', this)"><i class="fas fa-terminal"></i> 终端</button>
                    <button class="ws-tab" data-tab="wsPreview" onclick="switchWsTab('wsPreview', this)"><i class="fas fa-globe"></i> 浏览器</button>
                    <button class="ws-refresh" title="刷新文件" onclick="loadFileTree()"><i class="fas fa-sync-alt"></i></button>
                </div>
                <div class="ws-pane active" id="wsFiles">
                    <div class="file-area" id="fileArea">
                        <!-- 文件区域（左树右预览）由 js/file-viewer.js 渲染 -->
                    </div>
                </div>
                <div class="ws-pane" id="wsChanges">
                    <div id="changesList"></div>
                    <div class="cp-note"><i class="fas fa-circle-info"></i> 终端命令产生的改动不在此列，请在文件树查看</div>
                </div>
                <div class="ws-pane" id="wsTerm">
                    <div id="termList"></div>
                </div>
                <div class="ws-pane" id="wsPreview">
                    <div class="empty-steps" id="previewEmpty">
                        <i class="fas fa-globe"></i>
                        <span>暂无浏览内容</span>
                    </div>
                    <!-- allow-popups*：允许浏览器页内链接在新标签打开（如搜索结果页），且新标签不受沙箱限制 -->
                    <iframe class="ws-preview-frame" id="htmlPreviewFrame" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" style="display:none"></iframe>
                </div>
            </aside>
            </div>
        </div>
    </div>

    <!-- 设置弹窗由 js/settings.js 自创建并挂载到 body -->

    <!-- 图片灯箱：点击消息内图片全屏预览（置于主脚本前，确保脚本执行时已存在） -->
    <div class="lightbox" id="lightbox"><img alt=""></div>

    <!-- 会话右键菜单：重命名 / 删除（置于主脚本前，确保脚本执行时已存在） -->
    <div class="session-menu" id="sessionMenu">
        <button data-act="rename"><i class="fas fa-pen"></i>重命名</button>
        <button data-act="delete" class="danger"><i class="fas fa-trash-can"></i>删除</button>
    </div>

    <script>
        (function() {
            'use strict';

            const container = document.getElementById('messageContainer');
            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const typing = document.getElementById('typingIndicator');

            // AI 品牌符号（四角星火花，用于欢迎 Hero logo；单智能体无登录态，消息不展示头像）
            const AI_AVATAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z"/></svg>';
            
            // 初始隐藏typing indicator
            if (typing) typing.style.display = 'none';

            // ===== 状态管理 =====
            let currentSessionId = null;
            let sessions = [];

            // per-session 流式状态：支持多会话并行执行
            const sessionStates = new Map();
            function getSessionState(sid) {
                if (!sessionStates.has(sid)) {
                    sessionStates.set(sid, {
                        eventSource: null,       // 该会话的 SSE 连接
                        isProcessing: false,     // 该会话是否正在生成
                        steps: [],               // 本轮步骤快照
                        msgSteps: [],            // 本轮消息步骤
                        msgId: null,             // 本轮消息 ID
                        fullAnswer: '',          // 累积答案文本
                        activityEl: null,        // 当前活动 DOM 元素（仅 current session 有效）
                        plainBubble: false,      // 是否纯气泡模式
                        userMessage: ''          // 用户发送的消息文本（用于切换恢复）
                    });
                }
                return sessionStates.get(sid);
            }
            let messageStepsMap = new Map(); // 消息ID到步骤的映射（历史消息用）

            // 供 project-panel.js 判断流式状态（切换入口置灰/拦截）
            window.isChatStreaming = () => currentSessionId ? getSessionState(currentSessionId).isProcessing : false;
            
            // ===== 工作区面板（文件 + 终端）=====
            // 挂到 window 上供内联 onclick 调用
            // 同步右上角工作区开关的点亮态（面板可见即激活）
            function syncWsFloatActive() {
                const panel = document.getElementById('stepsPanel');
                document.getElementById('wsFloatBtn')?.classList.toggle('active', !panel.classList.contains('collapsed'));
            }
            window.toggleStepsPanel = function() {
                const panel = document.getElementById('stepsPanel');
                // 关闭时立即清理放大态（不播还原动画，避免与折叠动画打架）
                if (!panel.classList.contains('collapsed') && panel.classList.contains('maximized')) {
                    panel.classList.remove('maximized', 'overlay');
                    document.getElementById('wsPlaceholder')?.remove();
                    const btn = document.getElementById('wsMaxBtn');
                    btn.title = '放大';
                    btn.querySelector('i').className = 'fas fa-up-right-and-down-left-from-center';
                }
                panel.classList.toggle('collapsed');
                syncWsFloatActive();
            };

            // 放大：面板转为覆盖层从右向左平滑铺开盖住聊天区（侧边栏保留），再次点击反向滑回。
            // 聊天区底下原样保留，由同宽占位符钉住布局避免任何重排。
            window.toggleWsMaximize = function() {
                const panel = document.getElementById('stepsPanel');
                const btn = document.getElementById('wsMaxBtn');
                const maximized = !panel.classList.contains('maximized');
                if (maximized) {
                    // 占位符接管面板原来的 flex 位置，宽度与当前面板一致
                    const holder = document.createElement('div');
                    holder.id = 'wsPlaceholder';
                    holder.style.cssText = 'width:' + panel.getBoundingClientRect().width + 'px;flex-shrink:0;';
                    panel.parentNode.insertBefore(holder, panel);
                    // 先以当前宽度进入 overlay（右缘位置不变），强制回流后再加 maximized 触发宽度过渡
                    panel.classList.add('overlay');
                    void panel.offsetWidth;
                    panel.classList.add('maximized');
                } else {
                    // 反向：先撤 maximized 让宽度滑回原值，动画结束后再退出 overlay 并移除占位符
                    panel.classList.remove('maximized');
                    const onEnd = (e) => {
                        if (e.propertyName !== 'width') return;
                        panel.removeEventListener('transitionend', onEnd);
                        panel.classList.remove('overlay');
                        document.getElementById('wsPlaceholder')?.remove();
                    };
                    panel.addEventListener('transitionend', onEnd);
                }
                btn.title = maximized ? '还原' : '放大';
                btn.querySelector('i').className = maximized ? 'fas fa-down-left-and-up-right-to-center' : 'fas fa-up-right-and-down-left-from-center';
            };

            window.switchWsTab = function(paneId, tabBtn) {
                document.querySelectorAll('.ws-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.ws-pane').forEach(p => p.classList.remove('active'));
                tabBtn.classList.add('active');
                document.getElementById(paneId).classList.add('active');
                tabBtn.classList.remove('dot');
            };

            // ===== 变更面板、终端面板与文件区域（组件分别封装在 js/changes-panel.js、js/terminal-panel.js、js/file-viewer.js，此处只挂载与喂数据）=====
            ChangesPanel.init(document.getElementById('changesList'));
            TerminalPanel.init(document.getElementById('termList'));
            // 文件区域：左树右预览；打开预览时面板过窄则自动加宽一档，保证代码可读
            FileViewer.init(document.getElementById('fileArea'), {
                onOpen: () => {
                    const panel = document.getElementById('stepsPanel');
                    panel.classList.remove('collapsed');
                    syncWsFloatActive();
                    if (window.wsApplyWidth && panel.getBoundingClientRect().width < 576) {
                        window.wsApplyWidth(612);
                    }
                }
            });
            // 刷新按钮与旧调用点兼容：文件树加载已收编进 FileViewer
            window.loadFileTree = () => FileViewer.loadTree();

            // 新变更到达且「变更」Tab 未激活时打提示圆点
            function notifyChangesTab() {
                const tab = document.querySelector('.ws-tab[data-tab="wsChanges"]');
                if (tab && !document.getElementById('wsChanges').classList.contains('active')) {
                    tab.classList.add('dot');
                }
            }

            // 工作区宽度：默认 630px（CSS 控制）；左边缘拖拽调整，252px ~ 视口余宽，仅当前会话生效，刷新后恢复默认
            (function initWsResize() {
                const panel = document.getElementById('stepsPanel');
                const resizer = document.getElementById('wsResizer');
                if (!panel || !resizer) return;
                // 清除旧版本持久化的宽度，避免残留值让面板异常变宽
                localStorage.removeItem('wsPanelWidth');
                const applyWidth = (w) => {
                    // 上限受视口约束：给侧边栏+聊天区保留至少 690px
                    const max = Math.max(252, window.innerWidth - 690);
                    w = Math.min(max, Math.max(252, w));
                    panel.style.width = w + 'px';
                    panel.style.minWidth = w + 'px';
                    return w;
                };
                // 暴露给文件预览等场景程序化调宽（同一套钳制规则）
                window.wsApplyWidth = applyWidth;
                resizer.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    panel.classList.add('resizing');
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                    const onMove = (ev) => {
                        applyWidth(panel.getBoundingClientRect().right - ev.clientX);
                    };
                    const onUp = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        panel.classList.remove('resizing');
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';
                    };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });
            })();

            function extractThought(step) {
                try {
                    const content = JSON.parse(step.content);
                    if (content.thought) return content.thought;
                } catch (e) {}
                return '';
            }

            // 终端面板：渲染交给组件，有命令且 Tab 未激活时打提示圆点
            function renderTerminal(steps) {
                const count = TerminalPanel.render(steps);
                if (count === 0) return;
                const termTab = document.querySelector('.ws-tab[data-tab="wsTerm"]');
                if (termTab && !document.getElementById('wsTerm').classList.contains('active')) {
                    termTab.classList.add('dot');
                }
            }

            // ===== 聊天流内联活动（chip 创建与详情展开封装在 js/tool-chip.js）=====
            function truncateText(s, n) {
                s = String(s || '');
                return s.length > n ? s.slice(0, n) + '…' : s;
            }

            function createActivityMsg(msgId) {
                removeWelcomeHero();
                const msgEl = document.createElement('div');
                msgEl.className = 'msg codex';
                if (msgId) msgEl.dataset.msgId = msgId;
                msgEl.innerHTML = `
                    <div class="act-col">
                        <div class="act-flow"></div>
                        <div class="think-bar" style="display: none;">
                            <i class="fas fa-circle-notch fa-spin"></i>
                            <span class="tb-text">思考中…</span>
                        </div>
                    </div>
                `;
                container.insertBefore(msgEl, typing);
                return msgEl;
            }

            // 将一个步骤应用到活动容器；思考与 chip 按时间顺序交替追加到 .act-flow
            function applyStepToActivity(msgEl, step, idx, stepsRef, live) {
                const thinkBar = msgEl.querySelector('.think-bar');
                const flow = msgEl.querySelector('.act-flow');
                const thought = extractThought(step);

                if (thought) {
                    const seg = document.createElement('div');
                    seg.className = 'act-thought';
                    seg.textContent = thought;
                    flow.appendChild(seg);
                    if (live) {
                        // 脉冲节点跟随最新思考；状态条在流末尾表示"正在进行"
                        flow.querySelectorAll('.act-thought.current').forEach(t => t.classList.remove('current'));
                        seg.classList.add('current');
                        thinkBar.style.display = 'flex';
                        thinkBar.classList.add('running');
                    }
                }

                if (step.stepType === 'ACTION') {
                    // 紧随其思考之后成组；连续无思考的 ACTION 复用上一组 chips
                    // 详情块默认展开插在组后，判断时需跳过 .tc-detail
                    let last = flow.lastElementChild;
                    while (last && last.classList.contains('tc-detail')) last = last.previousElementSibling;
                    let chips = last;
                    if (!chips || !chips.classList.contains('tool-chips')) {
                        chips = document.createElement('div');
                        chips.className = 'tool-chips';
                        flow.appendChild(chips);
                    }
                    const chip = ToolChip.create(step, idx, stepsRef, live);
                    chips.appendChild(chip);
                    // 详情默认展开（实时与历史一致），点击 chip 可单独收起
                    ToolChip.open(chip);
                } else if (step.stepType === 'OBSERVATION') {
                    ToolChip.resolveRunning(flow, true);
                } else if (step.stepType === 'ERROR') {
                    ToolChip.resolveRunning(flow, false);
                }
            }

            // 执行结束：状态条隐藏、脉冲节点复位，未完成 chip 置为完成（详情保持展开）
            function finalizeActivity(msgEl) {
                if (!msgEl) return;
                ToolChip.resolveAll(msgEl);
                msgEl.querySelector('.think-bar').style.display = 'none';
                msgEl.querySelectorAll('.act-thought.current').forEach(t => t.classList.remove('current'));
            }

            // 回答写入活动容器（活动 + 回答同列）
            function setActivityAnswer(msgEl, content) {
                const col = msgEl.querySelector('.act-col');
                let bubble = col.querySelector('.bubble');
                if (!bubble) {
                    const now = new Date();
                    const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                        now.getMinutes().toString().padStart(2, '0');
                    bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    const time = document.createElement('div');
                    time.className = 'time';
                    time.textContent = timeStr;
                    col.appendChild(bubble);
                    col.appendChild(time);
                }
                bubble.innerHTML = renderMarkdown(content);
                enhanceCodeBlocks(col);
            }

            // ===== 文件树活动徽标 =====
            function findTreeItem(filePath) {
                if (!filePath) return null;
                const norm = String(filePath).replace(/\\/g, '/').replace(/^\.\//, '');
                const items = document.querySelectorAll('.tree-item[data-is-dir="false"]');
                for (const item of items) {
                    const p = (item.dataset.path || '').replace(/\\/g, '/');
                    if (p === norm || norm.endsWith('/' + p) || p.endsWith('/' + norm)) return item;
                }
                return null;
            }

            function setFileBadge(filePath, state) {
                const item = findTreeItem(filePath);
                if (!item) return;
                const node = item.querySelector('.node');
                let badge = node.querySelector('.factivity');
                if (!state) {
                    if (badge) badge.remove();
                    return;
                }
                if (!badge) {
                    badge = document.createElement('span');
                    node.appendChild(badge);
                }
                badge.className = 'factivity ' + state;
                badge.textContent = state === 'reading' ? 'R' : state === 'writing' ? 'W' : 'M';
            }

            // 清除进行中徽标：R 移除，W 转为 M
            function clearTransientBadges() {
                document.querySelectorAll('.factivity.reading').forEach(b => b.remove());
                document.querySelectorAll('.factivity.writing').forEach(b => {
                    b.className = 'factivity modified';
                    b.textContent = 'M';
                });
            }

            function clearAllBadges() {
                document.querySelectorAll('.factivity').forEach(b => b.remove());
            }

            let pendingFileAction = null;

            function updateTreeActivity(step) {
                if (step.stepType === 'ACTION') {
                    const args = step.toolArgs || {};
                    const fp = args.file_path || args.path;
                    if (!fp) { pendingFileAction = null; return; }
                    if (step.toolName === 'read') {
                        setFileBadge(fp, 'reading');
                        pendingFileAction = { tool: 'read', path: fp };
                    } else if (step.toolName === 'write' || step.toolName === 'edit') {
                        setFileBadge(fp, 'writing');
                        pendingFileAction = { tool: step.toolName, path: fp };
                    } else {
                        pendingFileAction = null;
                    }
                } else if (step.stepType === 'OBSERVATION' && pendingFileAction) {
                    if (pendingFileAction.tool === 'read') {
                        const item = findTreeItem(pendingFileAction.path);
                        const badge = item && item.querySelector('.factivity');
                        if (badge && badge.classList.contains('reading')) badge.remove();
                    } else {
                        setFileBadge(pendingFileAction.path, 'modified');
                    }
                    pendingFileAction = null;
                }
            }

            // 文件树 W/M 徽标点击：跳转变更面板并定位展开该文件
            document.getElementById('fileTree').addEventListener('click', function(e) {
                const badge = e.target.closest('.factivity');
                if (!badge || badge.classList.contains('reading')) return;
                e.stopPropagation();
                const item = badge.closest('.tree-item');
                document.getElementById('stepsPanel').classList.remove('collapsed');
                switchWsTab('wsChanges', document.querySelector('.ws-tab[data-tab="wsChanges"]'));
                ChangesPanel.openFile(item ? item.dataset.path : '');
            });

            // ===== 主题切换（按钮位于设置弹窗标题栏，由 settings.js 动态挂载，事件用委托绑定避免时序依赖） =====
            const HLJS_THEMES = {
                dark: 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css',
                light: 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css'
            };

            function applyHljsTheme(isLight) {
                document.getElementById('hljsTheme').href = HLJS_THEMES[isLight ? 'light' : 'dark'];
            }

            // 日间模式太阳图标：FA 免费版没有圆头光芒的实心太阳（fa-sun 光芒是三角形），改用内联 SVG：实心圆心 + 8 根圆头短线
            const SUN_SVG = '<svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-0.125em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'
                + '<circle cx="12" cy="12" r="4.6" fill="currentColor" stroke="none"/>'
                + '<line x1="12" y1="1.8" x2="12" y2="4.2"/><line x1="12" y1="19.8" x2="12" y2="22.2"/>'
                + '<line x1="1.8" y1="12" x2="4.2" y2="12"/><line x1="19.8" y1="12" x2="22.2" y2="12"/>'
                + '<line x1="4.8" y1="4.8" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="19.2" y2="19.2"/>'
                + '<line x1="4.8" y1="19.2" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="19.2" y2="4.8"/>'
                + '</svg>';

            function setThemeIcon(isLight) {
                const icon = document.getElementById('themeIcon');
                if (!icon) return;
                if (isLight) {
                    icon.className = '';
                    icon.innerHTML = SUN_SVG;
                } else {
                    icon.innerHTML = '';
                    icon.className = 'fas fa-moon';
                }
            }

            function toggleTheme() {
                document.body.classList.toggle('light-theme');
                const isLight = document.body.classList.contains('light-theme');
                setThemeIcon(isLight);
                applyHljsTheme(isLight);
                localStorage.setItem('codex-theme', isLight ? 'light' : 'dark');
                // 通知浏览器 Tab 内的预览页（搜索结果/阅读模式）同步切主题
                const previewFrame = document.getElementById('htmlPreviewFrame');
                if (previewFrame && previewFrame.contentWindow) {
                    previewFrame.contentWindow.postMessage({ type: 'qualia-theme', light: isLight }, '*');
                }
            }

            // 事件委托绑定主题按钮
            document.addEventListener('click', (e) => {
                if (e.target.closest && e.target.closest('#themeToggle')) toggleTheme();
            });

            const savedTheme = localStorage.getItem('codex-theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                applyHljsTheme(true);
                setThemeIcon(true);
            }

            // ===== 初始化 =====
            document.addEventListener('DOMContentLoaded', () => {
                loadSessions();
                TokenHeatmap.init(document.getElementById('tokenHeatmap'));
                checkModelConfigured();
                initModelSelector();
            });

            // 未配置模型时自动打开设置面板引导用户先完成配置；
            // 但若尚未选择工作区，工作区强制弹窗优先，设置引导顺延到选完工作区重载后
            async function checkModelConfigured() {
                try {
                    const wsRes = await fetch('/api/workspace');
                    if (wsRes.ok) {
                        const ws = await wsRes.json().catch(() => null);
                        if (ws && !ws.current) return;
                    }
                    const res = await fetch('/api/config/model');
                    if (!res.ok) return;
                    const info = await res.json();
                    if (info && info.configured === false) openSettings();
                } catch (e) {
                    // 静默失败，不影响主界面
                }
            }

            // 模型选择器：事件只绑定一次，渲染可重复执行（设置保存后回调刷新）
            let currentSelectedModel = '';
            let defaultModelName = '';
            let modelSelectorBound = false;

            async function refreshModelSelector() {
                try {
                    const res = await fetch('/api/config');
                    const config = await res.json();
                    const models = config.models || [];
                    defaultModelName = config.defaultModel || '';

                    const dropdown = document.getElementById('modelDropdown');
                    const modelNameEl = document.getElementById('modelName');

                    // 当前选中在新列表中不存在时回退默认模型（模型被删改名的保存场景）
                    if (!models.some(m => m.name === currentSelectedModel)) {
                        currentSelectedModel = defaultModelName;
                    }

                    // 生成下拉菜单项
                    dropdown.innerHTML = '';
                    models.forEach(model => {
                        const item = document.createElement('div');
                        item.className = 'model-dropdown-item' + (model.name === currentSelectedModel ? ' active' : '');
                        item.dataset.value = model.name;
                        item.innerHTML = `
                            <span>${model.name}${model.name === defaultModelName ? '<span class="default-badge">默认</span>' : ''}</span>
                            <i class="fas fa-check check-icon"></i>
                        `;
                        item.addEventListener('click', () => selectModel(model.name));
                        dropdown.appendChild(item);
                    });

                    modelNameEl.textContent = currentSelectedModel || '未配置';
                } catch (e) {
                    console.error('加载模型列表失败:', e);
                }
            }
            window.refreshModelSelector = refreshModelSelector;

            async function initModelSelector() {
                await refreshModelSelector();
                if (modelSelectorBound) return;
                modelSelectorBound = true;

                const selector = document.getElementById('modelSelector');
                // 点击切换下拉
                selector.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selector.classList.toggle('open');
                });
                // 点击外部关闭
                document.addEventListener('click', () => {
                    selector.classList.remove('open');
                });
            }
            
            function selectModel(modelName) {
                currentSelectedModel = modelName;
                document.getElementById('modelName').textContent = modelName;
                
                // 更新选中状态
                document.querySelectorAll('.model-dropdown-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.value === modelName);
                });
            }

            // ===== 会话管理 =====
            async function loadSessions() {
                try {
                    const response = await fetch('/api/chat/sessions');
                    // 接口异常时降级为空列表，避免错误对象进入渲染流程
                    const data = response.ok ? await response.json() : [];
                    sessions = Array.isArray(data) ? data : [];
                    renderSessionList();
                    if (sessions.length > 0 && !currentSessionId) {
                        await selectSession(sessions[0].id);
                    } else if (sessions.length === 0) {
                        showWelcome();
                    }
                } catch (error) {
                    console.error('加载会话列表失败:', error);
                    sessions = [];
                    renderSessionList();
                    showWelcome();
                }
            }

            // 会话日期分组：今天 / 昨天 / 近 7 天 / 近 30 天 / 更早
            function sessionGroupLabel(ts) {
                if (!ts) return '更早';
                const now = new Date();
                const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                const dayMs = 24 * 60 * 60 * 1000;
                if (ts >= startOfToday) return '今天';
                if (ts >= startOfToday - dayMs) return '昨天';
                if (ts >= startOfToday - 7 * dayMs) return '近 7 天';
                if (ts >= startOfToday - 30 * dayMs) return '近 30 天';
                return '更早';
            }

            function renderSessionList() {
                const list = document.querySelector('.conversation-list');
                let lastGroup = null;
                list.innerHTML = sessions.map(session => {
                    const group = sessionGroupLabel(session.createdAt);
                    const state = sessionStates.get(session.id);
                    const streaming = state && state.isProcessing;
                    let groupHtml = '';
                    if (group !== lastGroup) {
                        lastGroup = group;
                        groupHtml = `<li class="conv-group">${group}</li>`;
                    }
                    return `${groupHtml}
                    <li data-id="${session.id}" class="${session.id === currentSessionId ? 'active' : ''}${streaming ? ' streaming' : ''}">
                        ${streaming ? '<span class="streaming-dot" title="生成中"></span>' : '<i class="far fa-comment"></i>'}
                        <span class="session-title">${escapeHtml(session.title)}</span>
                    </li>`;
                }).join('');

                // 绑定点击事件（分组标题除外）
                list.querySelectorAll('li[data-id]').forEach(item => {
                    item.addEventListener('click', function() {
                        const id = this.dataset.id;
                        selectSession(id);
                    });
                    item.addEventListener('contextmenu', function(e) {
                        e.preventDefault();
                        openSessionMenu(e, this.dataset.id);
                    });
                });
            }

            // ===== 会话右键菜单：重命名 / 删除 =====
            const sessionMenu = document.getElementById('sessionMenu');
            let menuSessionId = null;

            function openSessionMenu(e, sessionId) {
                menuSessionId = sessionId;
                const mw = 140, mh = 84;
                let x = e.clientX, y = e.clientY;
                if (x + mw > window.innerWidth) x = window.innerWidth - mw - 8;
                if (y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
                sessionMenu.style.left = x + 'px';
                sessionMenu.style.top = y + 'px';
                sessionMenu.classList.add('open');
            }

            function closeSessionMenu() {
                sessionMenu.classList.remove('open');
                menuSessionId = null;
            }

            sessionMenu.addEventListener('click', function(e) {
                const btn = e.target.closest('button');
                if (!btn || !menuSessionId) return;
                const act = btn.dataset.act;
                const id = menuSessionId;
                closeSessionMenu();
                if (act === 'rename') startRenameSession(id);
                if (act === 'delete') window.deleteSession(id);
            });

            // 点击其他区域 / 滚动 / Esc 关闭菜单
            document.addEventListener('click', closeSessionMenu);
            document.addEventListener('scroll', closeSessionMenu, true);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeSessionMenu();
            });

            // ===== 会话行内重命名 =====
            function startRenameSession(sessionId) {
                const titleEl = document.querySelector(`.conversation-list li[data-id="${sessionId}"] .session-title`);
                if (!titleEl) return;
                const session = sessions.find(s => s.id === sessionId);
                const current = session ? session.title : '';
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'session-rename';
                input.value = current;
                input.maxLength = 50;
                titleEl.replaceWith(input);
                input.focus();
                input.select();
                let done = false;
                input.addEventListener('keydown', function(ev) {
                    ev.stopPropagation();
                    if (ev.key === 'Enter') input.blur();
                    if (ev.key === 'Escape') { input.value = current; input.blur(); }
                });
                input.addEventListener('click', function(ev) { ev.stopPropagation(); });
                input.addEventListener('blur', async function() {
                    if (done) return;
                    done = true;
                    const title = input.value.trim();
                    if (title && title !== current) {
                        try {
                            await fetch(`/api/chat/sessions/${sessionId}/title`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ title: title })
                            });
                            if (session) session.title = title;
                        } catch (err) { /* 保存失败静默，重渲染回退原标题 */ }
                    }
                    renderSessionList();
                });
            }

            async function selectSession(sessionId) {
                currentSessionId = sessionId;
                clearAllBadges();
                renderSessionList();

                // 加载历史消息（后端已完成的部分）
                await loadMessages(sessionId);

                // 如果该会话有正在进行的流式输出，重建 in-flight 活动消息
                const state = getSessionState(sessionId);
                if (state.isProcessing) {
                    // 检查用户消息是否已被 loadMessages 加载，避免重复显示
                    if (state.userMessage) {
                        const msgs = container.querySelectorAll('.msg.user');
                        const alreadyLoaded = Array.from(msgs).some(m =>
                            m.querySelector('.bubble')?.textContent === state.userMessage
                        );
                        if (alreadyLoaded) {
                            state.userMessage = ''; // 已加载，无需恢复
                        }
                    }
                    if (state.msgSteps.length > 0 || state.fullAnswer) {
                        // 有步骤或答案，重建完整活动消息
                        restoreLiveMessage(state);
                        renderTerminal(state.steps);
                        ChangesPanel.rebuild(state.steps);
                    } else if (state.userMessage) {
                        // 只有用户消息，没有步骤，恢复用户消息并显示 typing
                        restoreLiveMessage(state);
                        typing.style.display = 'flex';
                    }
                    setSendBtnStop(true);
                } else {
                    setSendBtnStop(false);
                }
            }

            // 从 session state 重建正在进行的流式活动消息 DOM
            function restoreLiveMessage(state) {
                // 恢复用户消息（如果尚未在历史中）
                if (state.userMessage) {
                    const lastMsg = container.lastElementChild;
                    const isUserAlreadyShown = lastMsg && lastMsg.classList.contains('user') &&
                        lastMsg.querySelector('.bubble')?.textContent === state.userMessage;
                    if (!isUserAlreadyShown) {
                        appendMessage('user', state.userMessage);
                    }
                }

                // 只有在有步骤或答案时才创建活动消息容器
                if (state.msgSteps.length === 0 && !state.fullAnswer) {
                    scrollToBottom();
                    return;
                }

                // 创建活动消息容器
                state.activityEl = createActivityMsg(state.msgId);

                // 回放所有已收到的步骤
                state.msgSteps.forEach((step, i) => {
                    applyStepToActivity(state.activityEl, step, i, state.msgSteps, false);
                });

                // 如果已有答案，渲染答案
                if (state.fullAnswer) {
                    if (state.plainBubble) {
                        state.activityEl._plainBubble = true;
                        state.activityEl.querySelector('.bubble').innerHTML = renderMarkdown(state.fullAnswer);
                        enhanceCodeBlocks(state.activityEl);
                    } else {
                        finalizeActivity(state.activityEl);
                        setActivityAnswer(state.activityEl, state.fullAnswer);
                    }
                }

                scrollToBottom();
            }

            window.createSession = async function() {
                try {
                    const response = await fetch('/api/chat/sessions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: '新会话' })
                    });
                    const session = await response.json();
                    sessions.unshift(session);
                    currentSessionId = session.id;
                    renderSessionList();
                    clearChat();
                    // 新会话不在处理中，重置按钮和typing状态
                    setSendBtnStop(false);
                    typing.style.display = 'none';
                } catch (error) {
                    console.error('创建会话失败:', error);
                }
            }

            window.deleteSession = async function(sessionId) {
                if (!confirm('确定删除这个会话吗？')) return;
                try {
                    await fetch(`/api/chat/sessions/${sessionId}`, { method: 'DELETE' });
                    // 关闭该会话的流式连接并清理状态
                    const delState = sessionStates.get(sessionId);
                    if (delState && delState.eventSource) delState.eventSource.close();
                    sessionStates.delete(sessionId);
                    sessions = sessions.filter(s => s.id !== sessionId);
                    if (currentSessionId === sessionId) {
                        currentSessionId = sessions.length > 0 ? sessions[0].id : null;
                        if (currentSessionId) {
                            await selectSession(currentSessionId);
                        } else {
                            clearChat();
                            setSendBtnStop(false);
                        }
                    }
                    renderSessionList();
                } catch (error) {
                    console.error('删除会话失败:', error);
                }
            };

            // 工作区切换完成后的整页状态刷新（由 project-panel.js 调用）：
            // 会话/步骤/变更/终端全部清空，重拉新工作区的会话列表、热力图与文件树
            window.onWorkspaceSwitched = async function() {
                // 关闭所有会话的流式连接并清空状态
                sessionStates.forEach((state) => {
                    if (state.eventSource) state.eventSource.close();
                });
                sessionStates.clear();
                currentSessionId = null;
                sessions = [];
                messageStepsMap.clear();
                renderTerminal([]);
                ChangesPanel.rebuild([]);
                clearChat();
                setSendBtnStop(false);
                typing.style.display = 'none';
                await loadSessions();
                TokenHeatmap.refresh();
                loadFileTree();
            };

            // ===== 消息管理 =====
            async function loadMessages(sessionId) {
                try {
                    const response = await fetch(`/api/chat/sessions/${sessionId}/messages`);
                    const messages = await response.json();
                    // 检查当前会话是否仍是请求的会话，避免快速切换时覆盖
                    if (currentSessionId === sessionId) {
                        renderMessages(messages);
                    }
                } catch (error) {
                    console.error('加载消息失败:', error);
                }
            }

            function renderMessages(messages) {
                // 清空现有消息（保留typing indicator）
                const msgs = container.querySelectorAll('.msg');
                msgs.forEach(m => m.remove());

                // 清空步骤映射
                messageStepsMap.clear();
                let allSteps = [];
                
                if (messages.length === 0) {
                    showWelcome();
                    renderTerminal([]);
                    ChangesPanel.rebuild([]);
                    return;
                }

                // 变更面板：每轮提问一个组（提问文本 + 随后 AI 回复的步骤）
                const changeGroups = [];
                let lastQuestion = null;

                messages.forEach((msg, index) => {
                    const msgId = `msg-${index}`;
                    const hasSteps = msg.steps && msg.steps.length > 0;
                    if (msg.role === 'user') lastQuestion = msg.content;
                    // 存储消息和步骤的关联
                    if (hasSteps) {
                        messageStepsMap.set(msgId, msg.steps);
                        allSteps = allSteps.concat(msg.steps);
                        if (msg.role !== 'user') {
                            changeGroups.push({ label: lastQuestion, steps: msg.steps });
                        }
                    }
                    if (msg.role !== 'user' && hasSteps) {
                        // 带步骤的 AI 消息：渲染完成态活动容器（chips + 回答）
                        const actEl = createActivityMsg(msgId);
                        msg.steps.forEach((s, i) => applyStepToActivity(actEl, s, i, msg.steps, false));
                        finalizeActivity(actEl);
                        setActivityAnswer(actEl, msg.content);
                    } else {
                        // 显示最终内容，传递消息ID与附件引用元数据
                        appendMessage(msg.role, msg.content, msgId, msg.attachments);
                    }
                });
                
                // 终端面板显示全部 bash 命令
                renderTerminal(allSteps);
                // 变更面板按对话轮分组重建
                ChangesPanel.rebuild(changeGroups);
                scrollToBottom();
            }

            /**
             * 文档方形卡片（气泡附件组与上传预览条同构）：类型图标居中 + 信息牌。
             * sizeBytes 为 null 时（历史引用不含大小）不显示大小。
             */
            function docCardHtml(name, sizeBytes) {
                const meta = docIconMeta(name);
                const sizeLabel = sizeBytes != null ? ' · ' + formatBytes(sizeBytes) : '';
                return `<div class="attach-card doc"><div class="doc-body"><i class="fas ${meta.icon} ${meta.cls}"></i></div><div class="doc-foot"><div class="n" title="${escapeHtml(name)}">${escapeHtml(name)}</div><div class="s">${meta.ext}${sizeLabel}</div></div></div>`;
            }

            /**
             * 附件卡片组（气泡外下方，与上传预览条同构）。
             * refs: [{name, type, url?, size?}]，type 兼容大小写（IMAGE/image）；
             * url 缺省（历史消息）按附件名走会话回显接口。
             */
            function buildAttachRow(refs) {
                if (!refs || !refs.length) return null;
                const row = document.createElement('div');
                row.className = 'msg-attach';
                refs.forEach(function(ref) {
                    const name = ref.name;
                    const type = (ref.type || '').toUpperCase();
                    if (type === 'IMAGE') {
                        const url = ref.url || `/api/attachments/${currentSessionId}/file/` + encodeURIComponent(name);
                        const im = document.createElement('img');
                        im.className = 'history-image';
                        im.src = url;
                        im.alt = '🖼 ' + name;
                        im.loading = 'lazy';
                        // 源文件缺失时呈占位框而非破图
                        im.onerror = function() { im.classList.add('broken'); };
                        row.appendChild(im);
                    } else {
                        const tmp = document.createElement('div');
                        tmp.innerHTML = docCardHtml(name, ref.size != null ? ref.size : null);
                        row.appendChild(tmp.firstElementChild);
                    }
                });
                return row;
            }

            function appendMessage(role, content, msgId, attachments) {
                removeWelcomeHero();
                const now = new Date();
                const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                    now.getMinutes().toString().padStart(2, '0');

                const msgEl = document.createElement('div');
                msgEl.className = `msg ${role === 'user' ? 'user' : 'codex'}`;
                if (msgId) msgEl.dataset.msgId = msgId;
                
                if (role === 'user') {
                    // 用户消息：纯文本气泡 + 附件卡片组在气泡外下方（由 attachments 引用元数据驱动）
                    msgEl.innerHTML = `
                        <div>
                            <div class="bubble">${escapeHtml(content)}</div>
                            <div class="time">${timeStr}</div>
                        </div>
                    `;
                    const attachRow = buildAttachRow(attachments);
                    if (attachRow) {
                        const timeEl = msgEl.querySelector('.time');
                        timeEl.parentElement.insertBefore(attachRow, timeEl);
                    }
                } else {
                    msgEl.innerHTML = `
                        <div>
                            <div class="bubble">${renderMarkdown(content)}</div>
                            <div class="time">${timeStr}</div>
                        </div>
                    `;
                }

                if (role !== 'user') enhanceCodeBlocks(msgEl);
                
                container.insertBefore(msgEl, typing);
                return msgEl;
            }
            
            function renderMarkdown(text) {
                if (!text) return '';
                try {
                    // 配置marked选项
                    marked.setOptions({
                        breaks: true,  // 支持换行符
                        gfm: true      // 支持GitHub风格markdown
                    });
                    return marked.parse(text);
                } catch (e) {
                    // 如果解析失败，返回转义后的原文
                    return escapeHtml(text);
                }
            }

            // ===== 代码块增强：语法高亮 + 工具条 + 复制/预览按钮 =====
            // HTML 预览渲染到右侧工作区的「浏览器」Tab，可边看对话边看效果
            // 挂到 window 供外部模块复用（如 js/browser.js 搜索详情的「查看全部」）
            // 沙箱策略：srcdoc（自建页）绝不可给 allow-same-origin，否则可逆向操作父页；
            // 外部 URL（源网页）则需要它，否则站点访问 cookie/localStorage 会报错白屏
            const SRCDOC_SANDBOX = 'allow-scripts allow-popups allow-popups-to-escape-sandbox';
            const URL_SANDBOX = 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox';

            function showPreviewFrame(frame) {
                const empty = document.getElementById('previewEmpty');
                frame.style.display = '';
                if (empty) empty.style.display = 'none';
                // 展开工作区并切到浏览器 Tab
                document.getElementById('stepsPanel').classList.remove('collapsed');
                switchWsTab('wsPreview', document.querySelector('.ws-tab[data-tab="wsPreview"]'));
            }

            window.openHtmlPreview = function openHtmlPreview(html) {
                const frame = document.getElementById('htmlPreviewFrame');
                frame.setAttribute('sandbox', SRCDOC_SANDBOX);
                frame.removeAttribute('src');
                frame.srcdoc = html;
                showPreviewFrame(frame);
            };

            // 在浏览器 Tab 直接加载外部网页（如 web_fetch 的「打开源网页」）
            // 注意：部分站点用 X-Frame-Options/CSP 禁止嵌入，会显示空白
            window.openUrlPreview = function openUrlPreview(url) {
                const frame = document.getElementById('htmlPreviewFrame');
                frame.setAttribute('sandbox', URL_SANDBOX);
                frame.removeAttribute('srcdoc');
                frame.src = url;
                showPreviewFrame(frame);
            };

            // ===== 设置弹窗：已封装到 js/settings.js（openSettings/closeSettings/QSettings）=====

            function enhanceCodeBlocks(scope) {
                scope.querySelectorAll('pre code').forEach(code => {
                    if (code.dataset.enhanced) return;
                    code.dataset.enhanced = '1';

                    if (window.hljs) {
                        try { hljs.highlightElement(code); } catch (e) {}
                    }

                    const pre = code.parentElement;
                    if (!pre || pre.tagName !== 'PRE') return;

                    const lang = (code.className.match(/language-([\w#+-]+)/) || [])[1] || 'code';
                    const canPreview = /^(html|htm|xhtml)$/i.test(lang);
                    const wrap = document.createElement('div');
                    wrap.className = 'code-wrap';
                    wrap.innerHTML = `
                        <div class="code-head">
                            <span class="dots"><i></i><i></i><i></i></span>
                            <span class="code-lang">${escapeHtml(lang)}</span>
                            <span class="head-slot">
                                ${canPreview ? '<button class="code-preview" title="预览"><i class="far fa-eye"></i></button>' : ''}
                                <button class="code-copy" title="复制代码"><i class="far fa-copy"></i></button>
                            </span>
                        </div>
                    `;
                    pre.parentNode.insertBefore(wrap, pre);
                    wrap.appendChild(pre);

                    const previewBtn = wrap.querySelector('.code-preview');
                    if (previewBtn) {
                        previewBtn.addEventListener('click', () => openHtmlPreview(code.textContent));
                    }

                    wrap.querySelector('.code-copy').addEventListener('click', function() {
                        const btn = this;
                        navigator.clipboard.writeText(code.textContent).then(() => {
                            btn.classList.add('copied');
                            btn.innerHTML = '<i class="fas fa-check"></i>';
                            setTimeout(() => {
                                btn.classList.remove('copied');
                                btn.innerHTML = '<i class="far fa-copy"></i>';
                            }, 1500);
                        });
                    });
                });
            }

            function removeWelcomeHero() {
                const hero = document.getElementById('welcomeHero');
                if (!hero) return;
                // 输入框还原回聊天区底部（移动 DOM 节点，事件与内容都保留）
                const inputArea = hero.querySelector('.input-area');
                if (inputArea) document.querySelector('.chat-area').appendChild(inputArea);
                hero.remove();
            }

            function showWelcome() {
                const msgs = container.querySelectorAll('.msg');
                msgs.forEach(m => m.remove());
                removeWelcomeHero();

                const hero = document.createElement('div');
                hero.className = 'welcome-hero';
                hero.id = 'welcomeHero';
                hero.innerHTML = `
                    <div class="hero-head">
                        <div class="hero-logo">${AI_AVATAR}</div>
                        <div class="hero-title">Qualia Code</div>
                    </div>
                    <div class="hero-sub">你的 AI 编程搭档 —— 写代码、重构、调试、解释算法都在行</div>
                `;
                container.insertBefore(hero, typing);

                // 输入框移入 Hero（标题下方），垂直水平居中
                const inputArea = document.querySelector('.chat-area > .input-area');
                if (inputArea) hero.appendChild(inputArea);
                input.focus();
            }

            function clearChat() {
                showWelcome();
            }

            // ===== 文件树与文件预览：已封装到 js/file-viewer.js（FileViewer.init/loadTree/open/close）=====

            // ===== 工作空间折叠 =====
            window.toggleWorkspace = function() {
                const panel = document.getElementById('workspacePanel');
                const toggle = document.getElementById('workspaceToggle');
                const icon = toggle.querySelector('i');
                panel.classList.toggle('collapsed');
                if (panel.classList.contains('collapsed')) {
                    icon.className = 'fas fa-folder';
                    toggle.title = '展开工作空间';
                } else {
                    icon.className = 'fas fa-folder-open';
                    toggle.title = '折叠工作空间';
                }
            };

            // ===== 自动调整输入框高度 =====
            function autoResize(textarea) {
                // 空值直接回基准高（单行 52px）：空 textarea 的 scrollHeight 会算入 placeholder 折行高度
                if (!textarea.value) { textarea.style.height = '52px'; return; }
                // 先压回基准高再测量，避免 flex 容器中 height:auto 测量不稳
                textarea.style.height = '52px';
                textarea.style.height = Math.max(52, Math.min(textarea.scrollHeight, 200)) + 'px';
            }

            input.addEventListener('input', function() {
                autoResize(this);
            });

            // ===== 发送消息(SSE) =====

            // 发送按钮在生成期间切换为停止态
            function setSendBtnStop(stop) {
                sendBtn.classList.toggle('stop', stop);
                sendBtn.innerHTML = stop ? '<i class="fas fa-stop"></i>' : '<i class="fas fa-arrow-up"></i>';
                sendBtn.title = stop ? '停止生成' : '发送';
                // 流式期间工作区切换入口同步置灰（后端切换接口另有 BUSY 兜底）
                const wsBtn = document.getElementById('wsSwitchBtn');
                if (wsBtn) wsBtn.classList.toggle('disabled', stop);
                // hint 行已并入工具行，停止提示改由输入框 placeholder 承载
                const PH = '向 Qualia Code 提问，或描述你想写的代码…';
                if (stop) {
                    if (!input.dataset.origPh) input.dataset.origPh = PH;
                    input.placeholder = '生成中，点击红色按钮停止（仅断开前端，后端任务继续）';
                } else {
                    input.placeholder = input.dataset.origPh || PH;
                }
            }

            // 停止生成：仅断开前端流，后端任务继续执行
            window.stopGeneration = function() {
                if (!currentSessionId) return;
                const state = getSessionState(currentSessionId);
                if (state.eventSource) state.eventSource.close();
                if (state.abortController) state.abortController.abort();
                if (state.activityEl) finalizeActivity(state.activityEl);
                state.isProcessing = false;
                state.eventSource = null;
                typing.style.display = 'none';
                setSendBtnStop(false);
                clearTransientBadges();
                renderSessionList();
            };

            // ===== 统一附件（图片直传视觉模型 / 文档解析注入），上传换回执，发送只带 ID =====
            const MAX_ATTACHMENTS = 4;
            const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
            const MAX_DOC_BYTES = 20 * 1024 * 1024;
            const attachBtn = document.getElementById('attachBtn');
            const attachmentInput = document.getElementById('attachmentInput');
            const imagePreview = document.getElementById('imagePreview');
            let pendingAttachments = []; // 上传回执 {id, name, type, size, objectUrl?}

            function formatBytes(bytes) {
                if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + 'MB';
                if (bytes >= 1024) return Math.round(bytes / 1024) + 'KB';
                return bytes + 'B';
            }

            /** 按扩展名返回文档类型图标与配色（预览条、气泡 chip、历史标签共用） */
            function docIconMeta(name) {
                const ext = (name && name.indexOf('.') >= 0 ? name.split('.').pop() : '').toLowerCase();
                if (ext === 'pdf') return { icon: 'fa-file-pdf', cls: 'icon-pdf', ext: 'PDF' };
                if (ext === 'docx') return { icon: 'fa-file-word', cls: 'icon-word', ext: 'WORD' };
                if (ext === 'csv' || ext === 'xlsx') return { icon: 'fa-file-excel', cls: 'icon-excel', ext: ext.toUpperCase() };
                return { icon: 'fa-file-lines', cls: 'icon-text', ext: ext ? ext.toUpperCase() : 'TXT' };
            }

            function renderAttachmentPreview() {
                imagePreview.innerHTML = '';
                imagePreview.style.display = pendingAttachments.length ? 'flex' : 'none';
                pendingAttachments.forEach(function(att, idx) {
                    const item = document.createElement('div');
                    item.className = 'preview-item' + (att.type === 'document' ? ' doc' : '');
                    if (att.type === 'image') {
                        item.innerHTML = `<img src="${att.objectUrl}" alt=""><button class="preview-remove" title="移除"><i class="fas fa-times"></i></button>`;
                    } else {
                        // 文档卡片与图片同规格：类型大图标居中 + 底部信息牌（文件名 / 类型 · 大小）
                        const meta = docIconMeta(att.name);
                        item.innerHTML = `<div class="doc-body"><i class="fas ${meta.icon} ${meta.cls}"></i></div><div class="doc-foot"><div class="n" title="${escapeHtml(att.name)}">${escapeHtml(att.name)}</div><div class="s">${meta.ext} · ${formatBytes(att.size)}</div></div><button class="preview-remove" title="移除"><i class="fas fa-times"></i></button>`;
                    }
                    item.querySelector('.preview-remove').addEventListener('click', function() {
                        if (att.objectUrl) URL.revokeObjectURL(att.objectUrl);
                        pendingAttachments.splice(idx, 1);
                        renderAttachmentPreview();
                    });
                    imagePreview.appendChild(item);
                });
            }

            async function addAttachmentFiles(files) {
                for (const file of files) {
                    if (pendingAttachments.length >= MAX_ATTACHMENTS) {
                        alert('一次最多携带 4 个附件');
                        break;
                    }
                    const isImage = file.type && file.type.indexOf('image/') === 0;
                    if (isImage && file.size > MAX_IMAGE_BYTES) {
                        alert(`图片 ${file.name} 超过 5MB 限制，未添加`);
                        continue;
                    }
                    if (!isImage && file.size > MAX_DOC_BYTES) {
                        alert(`文件 ${file.name} 超过 20MB 限制，未添加`);
                        continue;
                    }
                    if (!currentSessionId) {
                        await createSession();
                    }
                    const fd = new FormData();
                    fd.append('sessionId', currentSessionId);
                    fd.append('file', file, file.name || '粘贴图片.png');
                    try {
                        const resp = await fetch('/api/attachments', { method: 'POST', body: fd });
                        if (!resp.ok) {
                            alert(`附件 ${file.name} 上传失败（${resp.status}），未添加`);
                            continue;
                        }
                        const receipt = await resp.json();
                        if (receipt.status !== 'ready') {
                            alert(`附件 ${file.name} 解析失败：${receipt.error || '未知原因'}`);
                            continue;
                        }
                        const att = { id: receipt.id, name: receipt.name, type: receipt.type, size: file.size };
                        if (receipt.type === 'image') att.objectUrl = URL.createObjectURL(file);
                        pendingAttachments.push(att);
                        renderAttachmentPreview();
                    } catch (err) {
                        alert(`附件 ${file.name} 上传失败：${err.message}`);
                    }
                }
            }

            attachBtn.addEventListener('click', function() { attachmentInput.click(); });
            attachmentInput.addEventListener('change', function() {
                addAttachmentFiles(attachmentInput.files);
                attachmentInput.value = '';
            });

            // 支持直接粘贴截图
            input.addEventListener('paste', function(e) {
                const items = e.clipboardData && e.clipboardData.items;
                if (!items) return;
                const files = [];
                for (const item of items) {
                    if (item.type && item.type.indexOf('image/') === 0) {
                        const file = item.getAsFile();
                        if (file) files.push(file);
                    }
                }
                if (files.length) {
                    e.preventDefault();
                    addAttachmentFiles(files);
                }
            });

            // ===== 流式事件处理（EventSource 与 POST fetch 共用） =====
            // 返回 true 表示流结束（收到 [DONE]）
            function handleStreamEvent(raw, sid, state) {
                if (raw === '[DONE]') {
                    console.log('SSE stream done');
                    if (state.eventSource) { state.eventSource.close(); state.eventSource = null; }
                    if (state.activityEl) finalizeActivity(state.activityEl);
                    state.isProcessing = false;
                    state.abortController = null;
                    // 仅当前会话才更新 UI 状态
                    if (sid === currentSessionId) {
                        typing.style.display = 'none';
                        setSendBtnStop(false);
                    }
                    clearTransientBadges();
                    renderSessionList();
                    return true;
                }

                try {
                    const data = JSON.parse(raw);

                    if (data.error) {
                        // 后端推流中的错误：直接作为回复展示
                        console.error('Stream error:', data.error);
                        handleStreamError(sid, state, data.error);
                        return false;
                    }

                    if (data.responseType === 'answer' && data.answer) {
                                // 最终答案：写入活动容器同列；无步骤时走普通气泡
                                state.fullAnswer = data.answer;
                                // 当前可见会话才操作 DOM
                                if (sid === currentSessionId) {
                                    typing.style.display = 'none';
                                }
                                if (!state.activityEl && state.msgSteps.length === 0) {
                                    if (sid === currentSessionId) {
                                        state.activityEl = appendMessage('assistant', state.fullAnswer, state.msgId);
                                        state.activityEl._plainBubble = true;
                                    }
                                    state.plainBubble = true;
                                }
                                if (state.activityEl) {
                                    if (state.activityEl._plainBubble) {
                                        state.activityEl.querySelector('.bubble').innerHTML = renderMarkdown(state.fullAnswer);
                                        enhanceCodeBlocks(state.activityEl);
                                    } else {
                                        finalizeActivity(state.activityEl);
                                        setActivityAnswer(state.activityEl, state.fullAnswer);
                                    }
                                }
                                // 关联步骤到消息
                                if (state.msgSteps.length > 0) {
                                    messageStepsMap.set(state.msgId, state.msgSteps);
                                }
                                if (sid === currentSessionId) scrollToBottom();
                                return false;
                    } else if (data.responseType === 'step' && data.steps && data.steps.length > 0) {
                        // 步骤到达：驱动聊天流内联活动容器
                        const step = data.steps[0];
                        if (!state.activityEl) {
                            if (sid === currentSessionId) {
                                typing.style.display = 'none';
                                state.activityEl = createActivityMsg(state.msgId);
                            }
                        }
                        state.msgSteps.push(step);
                        state.steps.push(step);
                        if (state.activityEl && sid === currentSessionId) {
                            applyStepToActivity(state.activityEl, step, state.msgSteps.length - 1, state.msgSteps, true);
                            updateTreeActivity(step);
                            if (ChangesPanel.record(step)) notifyChangesTab();
                            renderTerminal(state.steps);
                            scrollToBottom();
                        }
                        return false;
                    }
                } catch (e) {
                    // 非JSON负载：后端参数校验失败的纯文本错误直接展示
                    if (raw && raw.indexOf('发生错误') === 0) {
                        handleStreamError(sid, state, raw);
                    } else {
                        console.error('Parse error:', e, raw);
                    }
                }
                return false;
            }

            function handleStreamError(sid, state, fallbackMsg) {
                if (state.eventSource) { state.eventSource.close(); state.eventSource = null; }
                if (state.abortController) { try { state.abortController.abort(); } catch (e) { /* ignore */ } state.abortController = null; }
                if (state.activityEl && !state.plainBubble) finalizeActivity(state.activityEl);
                if (!state.fullAnswer && !state.activityEl && sid === currentSessionId) {
                    appendMessage('assistant', fallbackMsg || '连接失败，请重试');
                }
                state.isProcessing = false;
                if (sid === currentSessionId) {
                    typing.style.display = 'none';
                    setSendBtnStop(false);
                }
                clearTransientBadges();
                renderSessionList();
            }

            // POST JSON + fetch 流式读取（带图消息走此通道，base64 过大不适合 GET 查询参数）
            async function streamChatPost(body, signal, sid, state) {
                const resp = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    signal
                });
                if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
                const reader = resp.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buf = '';
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, {stream: true});
                    let idx;
                    while ((idx = buf.indexOf('\n\n')) !== -1) {
                        const rawEvent = buf.slice(0, idx);
                        buf = buf.slice(idx + 2);
                        let finished = false;
                        for (const line of rawEvent.split('\n')) {
                            if (line.startsWith('data:') && handleStreamEvent(line.slice(5).trim(), sid, state)) {
                                finished = true;
                            }
                        }
                        if (finished) {
                            try { await reader.cancel(); } catch (e) { /* ignore */ }
                            return;
                        }
                    }
                }
            }

            async function sendMessage() {
                const text = input.value.trim();
                const attachments = pendingAttachments.slice();
                if (!text && attachments.length === 0) return;
                const curState = currentSessionId ? getSessionState(currentSessionId) : null;
                if (curState && curState.isProcessing) return;

                if (!currentSessionId) {
                    await createSession();
                }

                const sid = currentSessionId;
                const state = getSessionState(sid);

                input.value = '';
                autoResize(input);
                pendingAttachments = [];
                renderAttachmentPreview();
                state.isProcessing = true;
                setSendBtnStop(true);

                // 重置本轮状态
                state.steps = [];
                state.msgSteps = [];
                state.fullAnswer = '';
                state.activityEl = null;
                state.plainBubble = false;
                state.msgId = `msg-${Date.now()}`;
                state.userMessage = text;

                // 清空终端面板和上一轮的进行中徽标，变更面板开启新对话轮分组
                renderTerminal([]);
                clearTransientBadges();
                ChangesPanel.beginGroup(text || (attachments.length ? attachments[0].name : ''));

                const userMsgEl = appendMessage('user', text);
                if (attachments.length) {
                    // 实时附件组：与历史渲染同构（气泡外下方 80×80 方形卡片网格）
                    const refs = attachments.map(function(att) {
                        return { name: att.name, type: att.type, url: att.objectUrl, size: att.size };
                    });
                    const attachRow = buildAttachRow(refs);
                    const timeEl = userMsgEl.querySelector('.time');
                    timeEl.parentElement.insertBefore(attachRow, timeEl);
                }
                scrollToBottom();

                // 显示typing indicator（首个 step 到达后由思考状态条接管）
                typing.style.display = 'flex';

                try {
                    // 获取选择的模型
                    const modelParam = currentSelectedModel ? `&model=${encodeURIComponent(currentSelectedModel)}` : '';

                    if (attachments.length) {
                        // 带附件：POST JSON + fetch 流式读取（回执 ID 轻量，也可走 GET，但统一 POST 处理）
                        const controller = new AbortController();
                        state.abortController = controller;
                        const body = {
                            sessionId: sid,
                            message: text,
                            attachmentIds: attachments.map(function(att) { return att.id; })
                        };
                        if (currentSelectedModel) body.model = currentSelectedModel;
                        await streamChatPost(body, controller.signal, sid, state);
                    } else {
                        // 纯文本：EventSource SSE
                        const url = `/api/chat/stream?sessionId=${encodeURIComponent(sid)}&message=${encodeURIComponent(text)}${modelParam}`;
                        console.log('Connecting to SSE:', url);
                        const eventSource = new EventSource(url);
                        state.eventSource = eventSource;

                        eventSource.onopen = function() {
                            console.log('SSE connection opened');
                        };

                        eventSource.onmessage = function(event) {
                            handleStreamEvent(event.data, sid, state);
                        };

                        eventSource.onerror = function(error) {
                            console.error('SSE error:', error);
                            handleStreamError(sid, state, null);
                        };
                    }
                } catch (error) {
                    if (error && error.name === 'AbortError') {
                        // 用户主动停止，无需提示
                    } else {
                        appendMessage('assistant', '发送失败: ' + error.message);
                    }
                    if (state.activityEl && !state.plainBubble) finalizeActivity(state.activityEl);
                    state.isProcessing = false;
                    state.abortController = null;
                    typing.style.display = 'none';
                    setSendBtnStop(false);
                    clearTransientBadges();
                    renderSessionList();
                }
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str || '';
                return div.innerHTML;
            }

            function scrollToBottom() {
                container.scrollTop = container.scrollHeight;
            }

            sendBtn.addEventListener('click', function() {
                const curState = currentSessionId ? getSessionState(currentSessionId) : null;
                if (curState && curState.isProcessing) {
                    stopGeneration();
                } else {
                    sendMessage();
                }
            });
            input.addEventListener('keydown', function(e) {
                // 回车发送（Shift+Enter 换行）；输入法选词中的回车（isComposing / keyCode 229）不触发
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
                    e.preventDefault();
                    const curState = currentSessionId ? getSessionState(currentSessionId) : null;
                    if (!curState || !curState.isProcessing) sendMessage();
                }
            });

            setTimeout(scrollToBottom, 50);

            // ===== 刷新文件树 =====
            document.querySelector('.workspace-header button')?.addEventListener('click', function() {
                loadFileTree();
            });

            // ===== 图片灯箱：点击消息内图片（实时/历史）全屏预览，点击任意处或 Esc 关闭 =====
            const lightbox = document.getElementById('lightbox');
            function closeLightbox() {
                lightbox.classList.remove('open');
                lightbox.querySelector('img').src = '';
            }
            container.addEventListener('click', function(e) {
                const img = e.target.closest('.msg-attach img, .history-image');
                if (img && !img.classList.contains('broken')) {
                    lightbox.querySelector('img').src = img.src;
                    lightbox.classList.add('open');
                }
            });
            lightbox.addEventListener('click', closeLightbox);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
            });

            console.log('🧠 Qualia Code UI 已启动');
        })();
    </script>
