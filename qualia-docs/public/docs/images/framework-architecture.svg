<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="#fafafa"/>

  <!-- Layer 1: User Input -->
  <rect x="220" y="25" width="200" height="45" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="52" text-anchor="middle" style="fill: #475569; font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 500;">用户输入</text>

  <!-- Connector: User → Agent -->
  <path d="M 320 70 L 320 95" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="320" cy="95" r="4" fill="#94a3b8"/>

  <!-- Layer 2: ReActAgent -->
  <rect x="70" y="95" width="500" height="56" rx="12" fill="url(#indigoGrad)" filter="url(#shadow)"/>
  <text x="320" y="120" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 16px; font-weight: 600;">ReActAgent</text>
  <text x="320" y="138" text-anchor="middle" style="fill: rgba(255,255,255,0.8); font-family: -apple-system, sans-serif; font-size: 11px;">Thought → Action → Observation</text>

  <!-- Connectors: Agent → Components -->
  <path d="M 114 151 L 114 185" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="114" cy="185" r="4" fill="#94a3b8"/>
  <path d="M 217 151 L 217 185" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="217" cy="185" r="4" fill="#94a3b8"/>
  <path d="M 320 151 L 320 185" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="320" cy="185" r="4" fill="#94a3b8"/>
  <path d="M 423 151 L 423 185" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="423" cy="185" r="4" fill="#94a3b8"/>
  <path d="M 526 151 L 526 185" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="526" cy="185" r="4" fill="#94a3b8"/>

  <!-- Layer 3: Five Core Components -->
  <!-- Model -->
  <rect x="70" y="185" width="88" height="70" rx="10" fill="url(#cyanGrad)" filter="url(#shadow)"/>
  <text x="114" y="215" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">模型</text>
  <text x="114" y="233" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 10px;">ChatModel</text>

  <!-- Memory -->
  <rect x="173" y="185" width="88" height="70" rx="10" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
  <text x="217" y="215" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">记忆</text>
  <text x="217" y="233" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 10px;">Memory</text>

  <!-- Tool -->
  <rect x="276" y="185" width="88" height="70" rx="10" fill="url(#amberGrad)" filter="url(#shadow)"/>
  <text x="320" y="215" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">工具</text>
  <text x="320" y="233" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 10px;">FunctionTool</text>

  <!-- Skill -->
  <rect x="379" y="185" width="88" height="70" rx="10" fill="url(#roseGrad)" filter="url(#shadow)"/>
  <text x="423" y="215" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">技能</text>
  <text x="423" y="233" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 10px;">Skill</text>

  <!-- MCP -->
  <rect x="482" y="185" width="88" height="70" rx="10" fill="url(#violetGrad)" filter="url(#shadow)"/>
  <text x="526" y="215" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">MCP</text>
  <text x="526" y="233" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 10px;">Protocol</text>

  <!-- Connectors: Components → External -->
  <path d="M 114 255 L 114 285" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="114" cy="285" r="4" fill="#94a3b8"/>
  <path d="M 320 255 L 320 285" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="320" cy="285" r="4" fill="#94a3b8"/>
  <path d="M 526 255 L 526 285" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="526" cy="285" r="4" fill="#94a3b8"/>

  <!-- Layer 4: External Services -->
  <rect x="70" y="285" width="88" height="50" rx="10" fill="white" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <text x="114" y="315" text-anchor="middle" style="fill: #0891b2; font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 500;">LLM API</text>

  <rect x="276" y="285" width="88" height="50" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="315" text-anchor="middle" style="fill: #d97706; font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 500;">本地 / 远程</text>

  <rect x="482" y="285" width="88" height="50" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="526" y="315" text-anchor="middle" style="fill: #7c3aed; font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 500;">MCP 服务器</text>
</svg>
