<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="280" fill="#fafafa"/>

  <!-- Layer 1: ChatModel Interface -->
  <rect x="70" y="30" width="500" height="50" rx="12" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="60" text-anchor="middle" style="fill: #4f46e5; font-family: -apple-system, sans-serif; font-size: 15px; font-weight: 600;">ChatModel 接口</text>

  <!-- Connectors to implementations -->
  <path d="M 147 80 L 147 110" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="147" cy="110" r="4" fill="#94a3b8"/>
  <path d="M 320 80 L 320 110" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="320" cy="110" r="4" fill="#94a3b8"/>
  <path d="M 493 80 L 493 110" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="493" cy="110" r="4" fill="#94a3b8"/>

  <!-- Layer 2: Implementations -->
  <rect x="70" y="110" width="155" height="65" rx="10" fill="url(#indigoGrad)" filter="url(#shadow)"/>
  <text x="147" y="140" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">Dashscope</text>
  <text x="147" y="158" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 11px;">ChatModel</text>

  <rect x="242" y="110" width="155" height="65" rx="10" fill="url(#cyanGrad)" filter="url(#shadow)"/>
  <text x="319" y="140" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">Kimi</text>
  <text x="319" y="158" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 11px;">ChatModel</text>

  <rect x="414" y="110" width="155" height="65" rx="10" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
  <text x="491" y="140" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">DeepSeek</text>
  <text x="491" y="158" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 11px;">ChatModel</text>

  <!-- Connectors to APIs -->
  <path d="M 147 175 L 147 205" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="147" cy="205" r="4" fill="#94a3b8"/>
  <path d="M 319 175 L 319 205" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="319" cy="205" r="4" fill="#94a3b8"/>
  <path d="M 491 175 L 491 205" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="491" cy="205" r="4" fill="#94a3b8"/>

  <!-- Layer 3: Vendor APIs -->
  <rect x="70" y="205" width="155" height="50" rx="10" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="147" y="235" text-anchor="middle" style="fill: #4f46e5; font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 500;">Dashscope API</text>

  <rect x="242" y="205" width="155" height="50" rx="10" fill="white" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <text x="319" y="235" text-anchor="middle" style="fill: #0891b2; font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 500;">Kimi API</text>

  <rect x="414" y="205" width="155" height="50" rx="10" fill="white" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="491" y="235" text-anchor="middle" style="fill: #059669; font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 500;">DeepSeek API</text>
</svg>
