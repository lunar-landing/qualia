<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="#fafafa"/>

  <!-- Layer 1: Parent Agent -->
  <rect x="120" y="30" width="400" height="60" rx="12" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="320" y="57" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 16px; font-weight: 600;">父智能体 (ReActAgent)</text>
  <text x="320" y="77" text-anchor="middle" style="fill: rgba(255,255,255,0.8); font-family: -apple-system, sans-serif; font-size: 11px;">任务分解 · 协调调度 · 结果聚合</text>

  <!-- Connector -->
  <path d="M 320 90 L 320 112" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="320" cy="112" r="4" fill="#94a3b8"/>

  <!-- Layer 2: AgentToolAdapter -->
  <rect x="120" y="112" width="400" height="50" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="112" width="400" height="50" rx="12" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="320" y="142" text-anchor="middle" style="fill: #7c3aed; font-family: -apple-system, sans-serif; font-size: 15px; font-weight: 600;">AgentToolAdapter</text>

  <!-- Connectors to sub-agents -->
  <path d="M 175 162 L 112 184" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="112" cy="184" r="4" fill="#94a3b8"/>
  <path d="M 320 162 L 320 184" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="320" cy="184" r="4" fill="#94a3b8"/>
  <path d="M 465 162 L 528 184" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="528" cy="184" r="4" fill="#94a3b8"/>

  <!-- Layer 3: Sub-Agents -->
  <rect x="30" y="184" width="165" height="60" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="112" y="212" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">研究助手</text>
  <text x="112" y="230" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 11px;">Http · Search</text>

  <rect x="237" y="184" width="165" height="60" rx="10" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  <text x="320" y="212" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">写作助手</text>
  <text x="320" y="230" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 11px;">Document · Edit</text>

  <rect x="445" y="184" width="165" height="60" rx="10" fill="url(#pinkGrad)" filter="url(#shadow)"/>
  <text x="528" y="212" text-anchor="middle" style="fill: white; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;">数据分析</text>
  <text x="528" y="230" text-anchor="middle" style="fill: rgba(255,255,255,0.85); font-family: -apple-system, sans-serif; font-size: 11px;">Database · Stats</text>

  <!-- Connectors to resources -->
  <path d="M 112 244 L 112 266" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="112" cy="266" r="4" fill="#94a3b8"/>
  <path d="M 320 244 L 320 266" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="320" cy="266" r="4" fill="#94a3b8"/>
  <path d="M 528 244 L 528 266" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="528" cy="266" r="4" fill="#94a3b8"/>

  <!-- Layer 4: Resources -->
  <rect x="30" y="266" width="165" height="50" rx="10" fill="white" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="112" y="296" text-anchor="middle" style="fill: #059669; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 500;">独立工具 + 记忆</text>

  <rect x="237" y="266" width="165" height="50" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="296" text-anchor="middle" style="fill: #d97706; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 500;">独立工具 + 记忆</text>

  <rect x="445" y="266" width="165" height="50" rx="10" fill="white" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
  <text x="528" y="296" text-anchor="middle" style="fill: #db2777; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 500;">独立工具 + 记忆</text>
</svg>