<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户数据表格</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #fafafa;
            border-bottom: 1px solid #e5e5e5;
        }

        th {
            padding: 16px 24px;
            font-weight: 600;
            font-size: 13px;
            color: #6e6e73;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #fafafa;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-active {
            background-color: #e6f9ee;
            color: #00a854;
        }

        .status-inactive {
            background-color: #f5f5f7;
            color: #86868b;
        }

        .status-pending {
            background-color: #fff7e6;
            color: #fa8c16;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #0071e3;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            margin-right: 12px;
            vertical-align: middle;
        }

        .user-info {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>用户</th>
                    <th>邮箱</th>
                    <th>角色</th>
                    <th>注册时间</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <div class="user-info">
                            <span class="avatar">李</span>
                            李明
                        </div>
                    </td>
                    <td>li.ming@example.com</td>
                    <td>管理员</td>
                    <td>2023-05-12</td>
                    <td><span class="status-badge status-active">活跃</span></td>
                </tr>
                <tr>
                    <td>
                        <div class="user-info">
                            <span class="avatar" style="background-color: #ff3b30;">王</span>
                            王芳
                        </div>
                    </td>
                    <td>wang.fang@example.com</td>
                    <td>编辑</td>
                    <td>2023-08-24</td>
                    <td><span class="status-badge status-active">活跃</span></td>
                </tr>
                <tr>
                    <td>
                        <div class="user-info">
                            <span class="avatar" style="background-color: #00a854;">张</span>
                            张伟
                        </div>
                    </td>
                    <td>zhang.wei@example.com</td>
                    <td>访客</td>
                    <td>2024-01-15</td>
                    <td><span class="status-badge status-inactive">离线</span></td>
                </tr>
                <tr>
                    <td>
                        <div class="user-info">
                            <span class="avatar" style="background-color: #fa8c16;">赵</span>
                            赵丽
                        </div>
                    </td>
                    <td>zhao.li@example.com</td>
                    <td>编辑</td>
                    <td>2024-03-02</td>
                    <td><span class="status-badge status-pending">待审核</span></td>
                </tr>
                <tr>
                    <td>
                        <div class="user-info">
                            <span class="avatar" style="background-color: #722ed1;">陈</span>
                            陈强
                        </div>
                    </td>
                    <td>chen.qiang@example.com</td>
                    <td>管理员</td>
                    <td>2022-11-30</td>
                    <td><span class="status-badge status-active">活跃</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
